<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Useful English Expressions 1 Pre/Post Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root {
    --primary-color: #007bff;
    --app-bg-color: #ffffff;
    --body-bg-color: #f0f2f5;
    --dark-color: #2c3e50;
  }
  body { font-family: 'Sarabun', sans-serif; background-color: var(--body-bg-color); color: var(--dark-color); }
  #app-container { background-color: var(--app-bg-color); border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 800px; margin: auto; min-height: 400px; }
  .lesson-btn-locked { opacity: 0.6; cursor: not-allowed !important; }
  .spinner-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
  .btn-custom { background: linear-gradient(45deg, #007bff, #4ca9ff); border: none; color: white; font-weight: bold; }
  .btn-custom-lesson { background: linear-gradient(45deg, #36D1DC, #5B86E5); border: none; color: white; text-align: left; padding: 1rem; }
  .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<body class="d-flex flex-column min-vh-100 p-3">
<main id="app-container" class="container-fluid p-4 my-auto animate-fade-in"></main>

<footer class="mt-auto text-center py-3 text-muted">
  <p class="mb-0">By : Winyoo Limrostham Sinc:5/2026</p>
</footer>

<div id="spinner-overlay" class="spinner-overlay" style="display: none;">
  <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
</div>

<div class="modal fade" id="alertModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="alertModalLabel">แจ้งเตือน</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="alertModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ปิด</button>
        <button type="button" class="btn btn-primary" id="modal-next-btn" style="display: none;">ถัดไป</button>
      </div>
    </div>
  </div>
</div>

<template id="login-page">
  <div class="text-center">
    <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Logo" style="height: 60px;" class="mb-4">
    <h4 class="text-primary fw-bold">Useful English Expressions 1</h4>
    <p class="text-muted">กรุณาใส่รหัสพนักงาน (Enter Employee ID)</p>
    <div class="mb-3 mx-auto" style="max-width: 300px;">
      <input type="text" id="employee-id-input" class="form-control form-control-lg text-center" placeholder="รหัสพนักงาน">
    </div>
    <button id="login-btn" class="btn btn-custom btn-lg w-100" style="max-width: 300px;">ไปกันเลย (Let's go)</button>
  </div>
</template>

<template id="main-menu-page">
  <div class="text-center mb-4"><h1 class="display-6">เมนูหลัก (Main Menu)</h1></div>
  <div class="d-grid gap-3">
    <button class="btn btn-custom-lesson btn-lg" onclick="navigateTo('lesson1-menu-page')">
      <strong>แบบทดสอบระดับที่ 1</strong><small class="d-block">(Level 1 Assessment)</small>
    </button>
    <button class="btn btn-info btn-lg text-white" onclick="showScoresPage()">ดูบันทึกผลการเรียน (Score results)</button>
    <button class="btn btn-danger btn-lg" onclick="logout()">ออกจากโปรแกรม (Logout)</button>
  </div>
</template>

<template id="lesson1-menu-page">
  <h2 class="text-center mb-4">Assessment Level 1</h2>
  <div class="d-grid gap-3" id="lesson-buttons-container">
    <button id="btn-test-1-1" class="btn btn-outline-primary p-3" onclick="startLesson('Test 1: Vocabulary', 'quiz-page-mc', 'แบบทดสอบที่ 1.1 การฟังคำศัพท์\n(Test 1.1 Listening)', 'MC', { timer: 30 })">
      <div class="d-flex justify-content-between align-items-center">
        <span>Test 1.1 Listening</span><i class="status-icon fs-4"></i>
      </div>
    </button>
    <button id="btn-test-1-2" class="btn btn-outline-primary p-3" onclick="startLesson('Test 1: Vocabulary', 'quiz-page-pronunciation', 'แบบทดสอบที่ 1.2 การออกเสียง\n(Test 1.2 Speaking)', 'PRON', {})">
      <div class="d-flex justify-content-between align-items-center">
        <span>Test 1.2 Speaking</span><i class="status-icon fs-4"></i>
      </div>
    </button>
  </div>
  <button class="btn btn-secondary mt-4 w-100" onclick="navigateTo('main-menu-page')">กลับหน้าหลัก</button>
</template>

<template id="quiz-page-mc">
  <div class="animate-fade-in">
    <h4 id="lesson-title-main" class="text-center"></h4>
    <div class="progress mb-3"><div id="lesson-progress" class="progress-bar" style="width: 0%;"></div></div>
    <div class="card mb-3 text-center p-4 shadow-sm">
      <h2 id="question-text-thai"></h2>
      <div class="d-flex justify-content-center gap-2 mt-3">
        <button id="listen-btn" class="btn btn-info text-white">ฟัง (Listen)</button>
      </div>
    </div>
    <div id="answer-options" class="d-grid gap-2"></div>
    <div id="timer-container" class="text-center mt-3" style="display:none;">เวลา: <span id="timer"></span> วินาที</div>
    <button id="submit-answer-btn" class="btn btn-success btn-lg w-100 mt-4" disabled>ส่งคำตอบ (Submit)</button>
  </div>
</template>

<template id="result-page">
  <div class="text-center animate-fade-in">
    <h2 class="display-4">สรุปผล</h2>
    <p class="display-1 fw-bold"><span id="final-score"></span> / <span id="total-questions"></span></p>
    <button id="finish-lesson-btn" class="btn btn-custom btn-lg">เสร็จสิ้น (Finish)</button>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
  let currentUser = null;
  let currentLessonData = null;
  let currentQuestionIndex = 0;
  let score = 0;
  let currentAccuracyData = [];
  let timerInterval = null;
  let selectedAnswer = null;

  const appContainer = document.getElementById('app-container');
  const spinner = document.getElementById('spinner-overlay');
  const alertModal = new bootstrap.Modal(document.getElementById('alertModal'));

  window.onload = () => {
    const cached = sessionStorage.getItem('currentUser');
    if (cached) { currentUser = JSON.parse(cached); navigateTo('main-menu-page'); }
    else { navigateTo('login-page'); }
  };

  function callGoogleApi(action, data, callback) {
    const cbName = 'jsonp_' + Date.now();
    let url = 'https://script.google.com/macros/s/AKfycbxo7s02cpN-FQaLSDnQCROBpEh9pTKri3vmL6Dxz99xMZ7h0GEAUqpWUu2mTZ9g_gM_VQ/exec';
    url += `?action=${action}&callback=${cbName}`;
    for (let key in data) { url += `&${key}=${encodeURIComponent(data[key])}`; }
    
    window[cbName] = (res) => { callback(res); delete window[cbName]; document.body.removeChild(script); };
    const script = document.createElement('script');
    script.src = url;
    document.body.appendChild(script);
  }

  function navigateTo(page, onReady) {
    const temp = document.getElementById(page);
    appContainer.innerHTML = '';
    appContainer.appendChild(temp.content.cloneNode(true));
    if (page === 'login-page') document.getElementById('login-btn').onclick = login;
    if (page === 'lesson1-menu-page') checkLessonLocks();
    if (onReady) onReady();
  }

  function login() {
    const id = document.getElementById('employee-id-input').value.trim();
    if (!id) return;
    showSpinner();
    callGoogleApi('getUserData', { empId: id }, (user) => {
      hideSpinner();
      if (user && user['Employee ID']) {
        currentUser = user;
        sessionStorage.setItem('currentUser', JSON.stringify(user));
        navigateTo('main-menu-page');
      } else { alert('ไม่พบรหัสพนักงาน'); }
    });
  }

  function checkLessonLocks() {
    showSpinner();
    callGoogleApi('getScores', { empId: currentUser['Employee ID'] }, (scores) => {
      hideSpinner();
      const completed = new Set(Array.isArray(scores) ? scores.map(s => s['Lesson Name']?.trim()) : []);
      // Logic for unlocking buttons would go here based on LESSON_SEQUENCE
    });
  }

  function startLesson(sheet, page, title, type, config) {
    showSpinner();
    callGoogleApi('getLessonData', { sheetName: sheet }, (data) => {
      hideSpinner();
      if (data && data.length > 0) {
        currentLessonData = { title, questions: data.sort(() => Math.random() - 0.5), config };
        currentQuestionIndex = 0; score = 0; currentAccuracyData = [];
        navigateTo(page, setupMcQuiz);
      }
    });
  }

  function setupMcQuiz() {
    const q = currentLessonData.questions[currentQuestionIndex];
    document.getElementById('question-text-thai').textContent = q['Translation'] || q['Thai Language'];
    const options = [q['Answer1(True)'], q['Answer2(Wrong)'], q['Answer3(Wrong)']].sort(() => Math.random() - 0.5);
    const container = document.getElementById('answer-options');
    container.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-outline-primary p-3';
      btn.textContent = opt;
      btn.onclick = () => {
        selectedAnswer = opt;
        document.getElementById('submit-answer-btn').disabled = false;
        Array.from(container.children).forEach(b => b.classList.replace('btn-primary', 'btn-outline-primary'));
        btn.classList.replace('btn-outline-primary', 'btn-primary');
      };
      container.appendChild(btn);
    });
    document.getElementById('submit-answer-btn').onclick = () => {
      const isCorrect = selectedAnswer === q['Answer1(True)'];
      if (isCorrect) score++;
      currentAccuracyData.push(isCorrect ? 1 : 0);
      if (++currentQuestionIndex < currentLessonData.questions.length) setupMcQuiz();
      else showResult();
    };
  }

  function showResult() {
    navigateTo('result-page', () => {
      document.getElementById('final-score').textContent = score;
      document.getElementById('total-questions').textContent = currentLessonData.questions.length;
      document.getElementById('finish-lesson-btn').onclick = saveScore;
    });
  }

  function saveScore() {
    showSpinner();
    const data = { 'Employee ID': currentUser['Employee ID'], 'Lesson Name': currentLessonData.title.replace(/\n/g, ' '), 'Score': score, 'Max score': currentLessonData.questions.length };
    callGoogleApi('saveScoreData', { scoreData: JSON.stringify(data), acc: currentAccuracyData.join(',') }, (res) => {
      hideSpinner();
      if (res.success) navigateTo('lesson1-menu-page');
    });
  }

  function showSpinner() { spinner.style.display = 'flex'; }
  function hideSpinner() { spinner.style.display = 'none'; }
  function logout() { sessionStorage.clear(); location.reload(); }
</script>
</body>
</html>
