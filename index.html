    }

  function speakSequence(sequence, onComplete = null) {
    if (!('speechSynthesis' in window) || !sequence || sequence.length === 0) {
        if (onComplete) onComplete();
        return;
    }
    speechSynthesis.cancel();
    speechSynthesis.resume(); 
    let currentIndex = 0;

    function speakNext() {
        if (currentIndex >= sequence.length) { if (onComplete) onComplete(); return; }
        const item = sequence[currentIndex];
        if (item.delay) { setTimeout(() => { currentIndex++; speakNext(); }, item.delay); return; }
        const utterance = new SpeechSynthesisUtterance(item.text);
        utterance.lang = item.lang;
        utterance.rate = item.rate || 1.0;
        let allVoices = speechSynthesis.getVoices();
        let suitableVoice = allVoices.find(voice => voice.lang === item.lang && voice.name.includes('Google'));
        if (!suitableVoice) suitableVoice = allVoices.find(voice => voice.lang === item.lang);
        if (suitableVoice) utterance.voice = suitableVoice;
        utterance.onend = () => { currentIndex++; speakNext(); };
        utterance.onerror = () => { currentIndex++; speakNext(); };
        speechSynthesis.speak(utterance);
    }
    if (speechSynthesis.getVoices().length === 0) {
      speechSynthesis.onvoiceschanged = speakNext;
    } else {
      speakNext();
    }
  }

    const isFindTheSoundQuiz = (lessonSheet.includes('Vocabulary') || lessonSheet.includes('Expressions')) && !config.isDialogue;

        cardFooterEl.style.display = 'block';
        appContainer.querySelector('#situation-text').textContent = 'สถานการณ์: ' + (question['Useful Expressions'] || 'General');
        englishQuestionEl.textContent = question['Question'];
        appContainer.querySelector('#question-text-thai').textContent = question['Question Thai'];
        appContainer.querySelector('#listen-btn').onclick = () => listenAndStartTimerMc(1.0, false);
        appContainer.querySelector('#listen-slow-btn').onclick = () => listenAndStartTimerMc(0.6, false);
    }

    const answers = shuffleArray([
        { text: question['Answer1(True)'], correct: true, trans: question['Answer1(True)Thai'] },
        { text: question['Answer2(Wrong)'], correct: false },
        { text: question['Answer3(Wrong)'], correct: false }
    ]);

    const container = appContainer.querySelector('#answer-options');
    container.innerHTML = '';
    answers.forEach((answer, index) => {
        const button = document.createElement('button');
        button.className = 'btn btn-outline-primary btn-lg answer-btn';
        button.textContent = config.isDialogue ? answer.text : ['A', 'B', 'C'][index];
        button.dataset.correct = answer.correct;
        button.dataset.text = answer.text;
        if (answer.trans) button.dataset.trans = answer.trans;
        
        // สำหรับ Dialogue ให้ปิดปุ่มไว้ก่อนจนกว่าจะกดฟัง
        if (config.isDialogue) button.disabled = true;

            appContainer.querySelector('#submit-answer-btn').disabled = false;
        };
        container.appendChild(button);
    });

    appContainer.querySelector('#submit-answer-btn').onclick = submitMcAnswer;

  function startRecording() {
    if (!speechRecognition) { 
      showPopup('ข้อผิดพลาด', 'เบราว์เซอร์ไม่รองรับการรับเสียง'); 
      return; 
    }

    // 1. ขอสิทธิ์การใช้งานไมโครโฟนก่อน
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        // เมื่อได้รับอนุญาต ให้ปิด stream นั้นเพื่อคืนไมโครโฟนให้ Browser Speech Recognition ใช้งาน
        stream.getTracks().forEach(track => track.stop());
        
        // 2. เริ่มการทำงานของ Speech Recognition
        executeSpeech();
      })
      .catch(err => {
        console.error("ไม่ได้รับสิทธิ์ไมโครโฟน: ", err);
        showPopup('ข้อผิดพลาด', 'กรุณากด "อนุญาต" (Allow) ให้เว็บเข้าถึงไมโครโฟนก่อนใช้งานครับ');
      });
  }

  // ฟังก์ชันแยกออกมาเพื่อเริ่มบันทึกจริง
  function executeSpeech() {
    if (recordingTimeout) clearTimeout(recordingTimeout);

    const recordBtn = appContainer.querySelector('#record-btn');
    recordBtn.disabled = true;
    recordBtn.innerHTML = '<i class="fas fa-microphone-alt fa-beat"></i> กำลังฟัง... (พูดภายใน 5 วิ)';
    
    speechRecognition.onresult = processSpeechResult;
    
    try {
      speechRecognition.start();
    } catch(e) {
      console.log("Recognition already started or error:", e);
    }

    recordingTimeout = setTimeout(() => {
      try { speechRecognition.stop(); } catch(e) {}
      recordBtn.disabled = false;
      recordBtn.innerHTML = '<i class="fas fa-microphone"></i> แตะเพื่อพูด (ลองใหม่)';
      showPopup('แจ้งเตือน', 'ระบบยังไม่ได้ยินเสียงพูดของคุณ กรุณาลองพูดใหม่อีกครั้งให้ชัดเจนครับ');
    }, 5000);
  }

  function processSpeechResult(event) {
      if (recordingTimeout) clearTimeout(recordingTimeout);
      const transcript = event.results[0][0].transcript;
      const target = appContainer.querySelector('#target-phrase-text').textContent;
      const similarity = calculateSimilarity(transcript.toLowerCase(), target.toLowerCase());
      
      // ลดเกณฑ์ความถูกต้องลงเหลือ 60% เพื่อความลื่นไหล
      const ok = similarity >= 60; 
      
      currentAccuracyData.push(Math.round(similarity));
      
      const resultArea = appContainer.querySelector('#record-result-area');
      resultArea.style.display = 'block';
      appContainer.querySelector('#transcript-text').textContent = `"${transcript}"`;
      
      let feedbackMsg = "Try Again";
      let feedbackClass = "text-danger";
      if (similarity >= 90) { feedbackMsg = "Perfect!"; feedbackClass = "text-success"; }
      else if (similarity >= 75) { feedbackMsg = "Excellent!"; feedbackClass = "text-success"; }
      else if (similarity >= 60) { feedbackMsg = "Good Job!"; feedbackClass = "text-info"; }
      
      const feedbackEl = appContainer.querySelector('#feedback-text');
      feedbackEl.textContent = `${feedbackMsg} (${Math.round(similarity)}%)`;
      feedbackEl.className = `h4 fw-bold ${feedbackClass}`;
      
      if (ok) score++; else lives--;
      
      appContainer.querySelector('#next-btn').style.display = 'block';
      appContainer.querySelector('#record-btn').style.display = 'none';
      
      updateLivesDisplay();
      speakSequence([{ text: feedbackMsg, lang: 'en-US' }]);
  }

  function nextPronunciationQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentLessonData.questions.length) setupPronunciationQuiz();
      else showResultScreen();
  }

  function showResultScreen() {
    navigateTo('result-page', () => {
      appContainer.querySelector('#final-score').textContent = score;
      appContainer.querySelector('#total-questions').textContent = currentLessonData.questions.length;
      appContainer.querySelector('#finish-lesson-btn').onclick = saveScore;
    });
  }

  const saveScore = async () => {
    showSpinner();
    const baseUrl = 'https://script.google.com/macros/s/AKfycbxo7s02cpN-FQaLSDnQCROBpEh9pTKri3vmL6Dxz99xMZ7h0GEAUqpWUu2mTZ9g_gM_VQ/exec';
    const url = 'https://corsproxy.io/?' + encodeURIComponent(baseUrl);
    const scoreData = {
        'Employee ID': currentUser['Employee ID'],
        'Title (Local)': currentUser['Title (Local)'],
        'Employee Name (Thai)': currentUser['Employee Name (Thai)'],
        'Employee Name (Eng)': currentUser['Employee Name (Eng)'],
        'Business Unit Code': currentUser['Business Unit Code'],
        'Business Unit Code Description': currentUser['Business Unit Code Description'],
        'Company Code': currentUser['Company Code'],
        'Company Code Description': currentUser['Company Code Description'],
        'Lesson Name': currentLessonData.title.replace(/\n/g, ' '), 
        'Max score': currentLessonData.questions.length, 
        'Score': score,
        'accuracyData': currentAccuracyData 
    };

    try {
        const response = await fetch(url, {
            method: 'POST',
            body: JSON.stringify({ 
                action: 'saveScoreData', 
                scoreData: scoreData 
            })
        });

        const result = await response.json();
        hideSpinner();

        if (result.success) {
            showPopup('บันทึกสำเร็จ', 'ประวัติกิจกรรมถูกบันทึกแล้ว คุณสามารถทำกิจกรรมถัดไปได้ทันที');
            document.getElementById('alertModal').addEventListener('hidden.bs.modal', () => navigateTo('lesson1-menu-page'), { once: true });
        } else {
            showPopup('เกิดข้อผิดพลาด', result.message || 'ไม่สามารถบันทึกคะแนนได้');
        }
    } catch (err) {
        hideSpinner();
        showPopup('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
        console.error(err);
    }
  };

  const showScoresPage = async () => {
    navigateTo('score-page', async () => {
        showSpinner();
        const baseUrl = 'https://script.google.com/macros/s/AKfycbxo7s02cpN-FQaLSDnQCROBpEh9pTKri3vmL6Dxz99xMZ7h0GEAUqpWUu2mTZ9g_gM_VQ/exec';
        const url = 'https://corsproxy.io/?' + encodeURIComponent(baseUrl);
        try {
            const response = await fetch(url, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'getScores', 
                    empId: currentUser['Employee ID'] 
                })
            });

            const scores = await response.json();
            hideSpinner();

            const tableBody = document.getElementById('score-table-body');
            if (!tableBody) return;
            
            tableBody.innerHTML = ''; 
            if (scores && scores.length > 0) {
                scores.forEach(s => {
                    const row = tableBody.insertRow();
                    // หมายเหตุ: s['AVG_Accuracy_Total'] มาจากฟังก์ชัน getScores เดิมของคุณ
                    const avg = parseFloat(s['AVG_Accuracy_Total']) || 0;
                    const displayAvg = `${(avg > 0 && avg <= 1 ? avg * 100 : avg).toFixed(0)}%`;
                    row.innerHTML = `<td>${s['Time Stamp']}</td><td>${s['Lesson Name']}</td><td>${s['Score']}</td><td>${s['Max score']}</td><td>${displayAvg}</td>`;
                });
                
                // เริ่มต้น DataTable ใหม่
                if ($.fn.DataTable.isDataTable('#score-table')) {
                    $('#score-table').DataTable().destroy();
                }
                new DataTable('#score-table', { responsive: true, order: [[0, 'desc']] });
            }
        } catch (err) {
            hideSpinner();
            console.error("Error fetching scores:", err);
            showPopup('เกิดข้อผิดพลาด', 'ไม่สามารถดึงข้อมูลคะแนนได้');
        }
    });
  };

  const startTimer = (seconds, selector, handler) => {
    resetTimer();
    const el = appContainer.querySelector(selector);
    if (!el) return;
    timerInterval = setInterval(() => {
      seconds--; el.textContent = seconds;
      if (seconds <= 0) { clearInterval(timerInterval); handler(); }
    }, 1000);
  };

  const calculateSimilarity = (s1, s2) => {
    let l = s1.length > s2.length ? s1 : s2;
    let s = s1.length > s2.length ? s2 : s1;
    if (l.length === 0) return 100.0;
    return ((l.length - editDistance(l, s)) / l.length) * 100;
  };

  const editDistance = (s1, s2) => {
      const costs = [];
      for (let i = 0; i <= s1.length; i++) {
          let lastValue = i;
          for (let j = 0; j <= s2.length; j++) {
              if (i === 0) costs[j] = j;
              else if (j > 0) {
                  let newValue = costs[j - 1];
                  if (s1.charAt(i - 1) !== s2.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                  costs[j - 1] = lastValue; lastValue = newValue;
              }
          }
          if (i > 0) costs[s2.length] = lastValue;
      }
      return costs[s2.length];
  };
</script>
