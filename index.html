 const LESSON_SEQUENCE = [
   { id: "btn-test-1-1", title: "แบบทดสอบที่ 1.1 การฟังคำศัพท์ภาษาอังกฤษที่เป็นประโยชน์ (Test 1.1 Listening Vocabulary)" },
   { id: "btn-test-1-2", title: "แบบทดสอบที่ 1.2 การออกเสียงคำศัพท์ภาษาอังกฤษที่เป็นประโยชน์ (Test 1.2 Speaking Vocabulary)" },
   { id: "btn-test-2-1", title: "แบบทดสอบที่ 2.1 การฟังสำนวนภาษาอังกฤษที่เป็นประโยชน์ (Test 2.1 Listening Expressions)" },
   { id: "btn-test-2-2", title: "แบบทดสอบที่ 2.2 การออกเสียงสำนวนภาษาอังกฤษที่เป็นประโยชน์ (Test 2.2 Speaking Expressions)" },
   { id: "btn-test-3-1", title: "แบบทดสอบที่ 3.1 การฟังคำถามและคำตอบ (Test 3.1 Listening Q&A)" },
   { id: "btn-test-3-2", title: "แบบทดสอบที่ 3.2 การออกเสียง คำถามและคำตอบ (Test 3.2 Speaking Q&A)" }
 ];

 function initializeApp() {
   const isSpeechSupported = ('speechSynthesis' in window);
   const isRecognitionSupported = ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window);

   if (!isSpeechSupported || !isRecognitionSupported) {
       showPopup('คำแนะนำ', 'เบราว์เซอร์นี้อาจไม่รองรับระบบเสียงสมบูรณ์ แนะนำให้ใช้ Samsung Internet สำหรับ Android หรือ Safari สำหรับ iOS');
   }

   if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
     const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
     speechRecognition = new SpeechRecognition();
     speechRecognition.continuous = false;
     speechRecognition.lang = 'en-US';
   }

   const cachedUser = sessionStorage.getItem('currentUser');
   if (cachedUser) {
     currentUser = JSON.parse(cachedUser);
     navigateTo('main-menu-page');
   } else {
     navigateTo('login-page');
   }
 }

 const showSpinner = () => spinner.style.display = 'flex';
 const hideSpinner = () => spinner.style.display = 'none';
 const shuffleArray = (array) => array.sort(() => Math.random() - 0.5);
 const resetTimer = () => { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } };

 const showPopup = (title, message, showNextButton = false, nextAction = null) => {
   alertModalLabel.textContent = title;
   alertModalBody.innerHTML = message;
   const nextBtn = document.getElementById('modal-next-btn');
   const closeBtn = document.querySelector('#alertModal .modal-footer .btn-secondary');

   if (showNextButton && typeof nextAction === 'function') {
     nextBtn.style.display = 'inline-block';
     nextBtn.onclick = () => { alertModal.hide(); nextAction(); };
     closeBtn.style.display = 'none';
   } else {
     nextBtn.style.display = 'none';
     closeBtn.style.display = 'inline-block';
   }
   alertModal.show();
 };

 function speakSequence(sequence, onComplete = null) {
   if (!('speechSynthesis' in window) || !sequence || sequence.length === 0) {
       if (onComplete) onComplete();
       return;
   }
   speechSynthesis.cancel();
   let currentIndex = 0;

   function speakNext() {
       if (currentIndex >= sequence.length) { if (onComplete) onComplete(); return; }
       const item = sequence[currentIndex];
       if (item.delay) { setTimeout(() => { currentIndex++; speakNext(); }, item.delay); return; }
       const utterance = new SpeechSynthesisUtterance(item.text);
       utterance.lang = item.lang;
       utterance.rate = item.rate || 1.0;
       utterance.onend = () => { currentIndex++; speakNext(); };
       speechSynthesis.speak(utterance);
   }
   speakNext();
 }

 const navigateTo = (pageName, onPageReady = null) => {
   const template = document.getElementById(pageName);
   if (template) {
     appContainer.innerHTML = '';
     appContainer.appendChild(template.content.cloneNode(true));
     if (pageName === 'lesson1-menu-page') checkLessonLocks();
     if (pageName === 'login-page') {
       const loginBtn = document.getElementById('login-btn');
       if(loginBtn) loginBtn.addEventListener('click', login);
     }
     if (typeof onPageReady === 'function') setTimeout(onPageReady, 0);
   }
 };

 function checkLessonLocks() {
   showSpinner();
   callGoogleApi('getScores', { empId: currentUser['Employee ID'] }, (scores) => {
       hideSpinner();
       if (!scores || scores.error) return;
       const completedLessons = new Set();
       if (Array.isArray(scores)) {
           scores.forEach(s => {
               if (s['Lesson Name']) completedLessons.add(s['Lesson Name'].trim());
           });
       }
       let canAccessNext = true; 
       LESSON_SEQUENCE.forEach((lesson) => {
           const btn = document.getElementById(lesson.id);
           if (!btn) return;
           const icon = btn.querySelector('.status-icon');
           const isDone = completedLessons.has(lesson.title.trim());
           if (canAccessNext) {
               btn.disabled = false;
               btn.classList.remove('lesson-btn-locked');
               icon.className = isDone ? "status-icon fas fa-check-circle text-success" : "status-icon fas fa-unlock text-primary";
           } else {
               btn.disabled = true;
               btn.classList.add('lesson-btn-locked');
               icon.className = "status-icon fas fa-lock text-muted";
           }
           canAccessNext = isDone;
       });
   });
 }

 const logout = () => { currentUser = null; sessionStorage.removeItem('currentUser'); navigateTo('login-page'); };

 function startLesson(sheetName, lessonId, lessonTitle, quizType, config = {}) {
   showSpinner();
   callGoogleApi('getLessonData', { sheetName: sheetName }, (data) => {
       hideSpinner();
       if (data && !data.error && data.length > 0) {
           currentLessonData = { id: lessonId, title: lessonTitle, sheet: sheetName, questions: shuffleArray(data), config };
           currentQuestionIndex = 0; score = 0; currentAccuracyData = []; 
           if (quizType === 'MC') navigateToMcQuiz();
           else if (quizType === 'PRON') navigateToPronunciationQuiz(); 
       } else {
           showPopup('ข้อผิดพลาด', 'ไม่พบข้อมูลหรือเกิดข้อผิดพลาดในการดึงข้อมูล');
       }
   });
 }

 function navigateToMcQuiz() { navigateTo('quiz-page-mc', setupMcQuiz); }
 function setupMcQuiz() {
   selectedAnswer = null;
   resetTimer();
   const question = currentLessonData.questions[currentQuestionIndex];
   const config = currentLessonData.config;
   const [mainTitle, subTitle] = currentLessonData.title.split('\n');
   appContainer.querySelector('#lesson-title-main').textContent = mainTitle;
   appContainer.querySelector('#lesson-title-sub').textContent = subTitle || '';
   appContainer.querySelector('#lesson-progress').style.width = `${((currentQuestionIndex + 1) / currentLessonData.questions.length) * 100}%`;
   appContainer.querySelector('#question-text-thai').textContent = question['Translation'] || question['Thai Language'];
   
   const answers = shuffleArray([
       { text: question['Answer1(True)'], correct: true },
       { text: question['Answer2(Wrong)'], correct: false },
       { text: question['Answer3(Wrong)'], correct: false }
   ]);

   const container = appContainer.querySelector('#answer-options');
   container.innerHTML = '';
   answers.forEach((answer) => {
       const button = document.createElement('button');
       button.className = 'btn btn-outline-primary btn-lg answer-btn';
       button.textContent = answer.text;
       button.onclick = () => {
           appContainer.querySelectorAll('.answer-btn').forEach(btn => btn.classList.remove('active'));
           button.classList.add('active');
           selectedAnswer = answer;
           appContainer.querySelector('#submit-answer-btn').disabled = false;
       };
       container.appendChild(button);
   });
   appContainer.querySelector('#submit-answer-btn').onclick = submitMcAnswer;
 }

 function submitMcAnswer() {
     const isCorrect = selectedAnswer && selectedAnswer.correct === true;
     if (isCorrect) score++;
     currentAccuracyData.push(isCorrect ? 1 : 0);
     if (++currentQuestionIndex < currentLessonData.questions.length) setupMcQuiz();
     else showResultScreen();
 }

 function navigateToPronunciationQuiz() { navigateTo('quiz-page-pronunciation', setupPronunciationQuiz); }
 function setupPronunciationQuiz() {
     const question = currentLessonData.questions[currentQuestionIndex];
     const target = question['Answer1(True)'] || question['Useful Expressions'] || question['Vocabulary'];
     appContainer.querySelector('#target-phrase-text').textContent = target;
     appContainer.querySelector('#record-btn').onclick = startRecording;
     appContainer.querySelector('#next-btn').onclick = nextPronunciationQuestion;
 }

 function startRecording() {
     if (!speechRecognition) return;
     speechRecognition.start();
     speechRecognition.onresult = (event) => {
         const transcript = event.results[0][0].transcript;
         const target = appContainer.querySelector('#target-phrase-text').textContent;
         const isMatch = transcript.toLowerCase() === target.toLowerCase();
         if (isMatch) score++;
         appContainer.querySelector('#next-btn').style.display = 'block';
     };
 }

 function nextPronunciationQuestion() {
     if (++currentQuestionIndex < currentLessonData.questions.length) setupPronunciationQuiz();
     else showResultScreen();
 }

 function showResultScreen() {
   navigateTo('result-page', () => {
     appContainer.querySelector('#final-score').textContent = score;
     appContainer.querySelector('#total-questions').textContent = currentLessonData.questions.length;
     appContainer.querySelector('#finish-lesson-btn').onclick = saveScore;
   });
 }

 function saveScore() {
   showSpinner();
   const scoreData = {
       'Employee ID': currentUser['Employee ID'],
       'Lesson Name': currentLessonData.title.replace(/\n/g, ' '), 
       'Score': score,
       'Max score': currentLessonData.questions.length
   };
   callGoogleApi('saveScoreData', { scoreData: JSON.stringify(scoreData) }, (result) => {
       hideSpinner();
       if (result && result.success) navigateTo('lesson1-menu-page');
   });
 }

 function showScoresPage() {
   navigateTo('score-page', () => {
       showSpinner();
       callGoogleApi('getScores', { empId: currentUser['Employee ID'] }, (scores) => {
           hideSpinner();
           const tableBody = document.getElementById('score-table-body');
           tableBody.innerHTML = ''; 
           if (Array.isArray(scores)) {
               scores.forEach(s => {
                   const row = tableBody.insertRow();
                   row.innerHTML = `<td>${s['Time Stamp']}</td><td>${s['Lesson Name']}</td><td>${s['Score']}</td><td>${s['Max score']}</td><td>${s['AVG_Accuracy_Total'] || 0}%</td>`;
               });
           }
       });
   });
 }

 function callGoogleApi(action, data, callbackFunction) {
    const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
    let url = 'https://script.google.com/macros/s/AKfycbxo7s02cpN-FQaLSDnQCROBpEh9pTKri3vmL6Dxz99xMZ7h0GEAUqpWUu2mTZ9g_gM_VQ/exec';
    url += '?action=' + action + '&callback=' + callbackName;
    for (let key in data) {
        url += '&' + key + '=' + encodeURIComponent(data[key]);
    }
    const script = document.createElement('script');
    window[callbackName] = function(response) {
        callbackFunction(response);
        delete window[callbackName];
        document.body.removeChild(script);
    };
    script.src = url;
    document.body.appendChild(script);
 }

 function login() {
    const empId = document.getElementById('employee-id-input').value.trim();
    if (!empId) return;
    showSpinner();
    callGoogleApi('getUserData', { empId: empId }, (user) => {
        hideSpinner();
        if (user && Object.keys(user).length > 0) {
            currentUser = user;
            sessionStorage.setItem('currentUser', JSON.stringify(user));
            navigateTo('main-menu-page');
        } else {
            showPopup('ล็อกอินไม่สำเร็จ', 'ไม่พบรหัสพนักงานนี้');
        }
    });
 }
</script>
